# 1.37.0 = biome SIZE and "NEXT TO", plus a bug in the biome search that had been there all along.
#          (1) THE BUG FIRST, because it is the one that was already costing people answers.
#          findBiomeHorizontal takes a findClosest flag and the finder passed FALSE. That does not
#          mean "any will do, be quick" — vanilla reservoir-samples a uniformly RANDOM match out of
#          the whole radius, which means it must scan all of it and then reports a patch that is
#          usually not the nearest. Both halves are wrong for a search whose entire output is a
#          coordinate and a distance: "jungle within 500" could report one at 480 with one sitting
#          at 90. Measured per call at radius 2000 (biomeShape --args="60 cost"): plains 14,211µs ->
#          899µs, forest 12,952 -> 665, jungle 15,419 -> 4,484, cherry grove 16,273 -> 6,898, pale
#          garden 15,684 -> 11,940. Nearest-first can stop as soon as nothing nearer can exist; the
#          random pick never can. A/B'd on checksums (bench shipped vs nearest, with a
#          shipped-recheck row that reproduced every checksum exactly).
#          IT IS A TRADE, NOT A FREE WIN, and the measurement says so. The two paths sample the
#          radius on slightly DIFFERENT grids — the random one runs a full square out to the exact
#          radius, the nearest one walks rings outward and truncates to a whole number of steps — so
#          each finds a few the other does not, right at the edge. Over 200 seeds at radius 1000
#          (biomeShape --args="200 closest"): plains 190 found by both, 4 only by the old path, 0
#          only by the new; jungle 88 both, 11 old-only, 2 new-only. The gain is the distance:
#          MEDIAN reported distance plains 792 -> 286, forest 824 -> 286, jungle 840 -> 543, desert
#          871 -> 572. On the benchmark's jungle search that came out as 954 seeds matched by both,
#          74 only by the old path, 25 only by the new, and the jungle CLOSER on 721 of the 954.
#          Losing a match at 990 blocks in a 1000-block search, in exchange for the ones you keep
#          being 300 rather than 800 blocks away, is the right way round.
#          (2) SIZE IS PER BIOME NOW, and the old constants are gone for a measured reason. There
#          used to be one threshold for everything (big 224, huge 384). The median pale garden spans
#          32 blocks and the median warm ocean spans 480, so that number rejected every pale garden
#          that has ever existed and accepted very nearly every ocean. NEW BiomeShape holds each
#          biome's own measured p33 and p67 over 60 seeds, so "big" always means the top third OF
#          THAT BIOME: pale garden >=64, cherry grove >=96, plains >=256, deep ocean >=512, warm
#          ocean >=608. "small" is a real search for the first time — a span CEILING at the p33 —
#          instead of being answered with "small can't be checked".
#          SIX BIOMES GET NO SIZE CONTROL AT ALL: river, frozen river, beach, snowy beach, stony
#          shore and jagged peaks all measured 32 small / 64 large with a maximum barely above it,
#          so they are effectively one size. A control that cannot change the answer is worse than
#          no control — it reads as a filter and filters nothing. Nether and End biomes were never
#          measured and print nothing rather than a borrowed number, the same rule the row rarities
#          have always followed.
#          (3) "NEXT TO" — and the cheap version does not work, which is worth recording because it
#          looks obviously right. Both things are already located by the funnel, so subtracting
#          their positions is free. But each was found by searching outward from SPAWN, and the
#          patch nearest the PLAYER is not the patch nearest the other thing: measured over seven
#          pairs, that free check was 2x to 8x too far EVERY time (plains + forest read as 1583
#          blocks apart; the real nearest is 181). So adjacency runs its own search, anchored on the
#          biome patch, and it runs LAST, after every cheap test in the wish has passed. Defaults
#          are the measured p75 of the real nearest-neighbour distance: 256 blocks biome-to-biome,
#          512 biome-to-structure (structures are sparser). Adjustable in the picker from 64 to
#          1024, with a warning under 192 — the closest MEDIAN any measured pair managed was 181, so
#          tighter than that and most seeds simply cannot comply.
#          The structure end is NOT searched twice: the funnel already enumerated every candidate in
#          range, so all that changes is the order they are tried in — nearest to the biome instead
#          of nearest to spawn. And the far end's own reach is widened to anchor.radius + within,
#          without which the whole feature was a no-op in Exact mode: every target gets 64 blocks
#          from spawn there, so "cherry grove next to a village" would have demanded both at spawn
#          and then asked, pointlessly, whether they were within 512 of each other.
#          (4) REFUSALS THAT SAY WHY. "Plains next to plains" is not rare or hard, it is not a
#          question — a biome is always next to itself — so it is refused with that sentence and the
#          plains are still searched. Same for a pair spanning two dimensions. One method decides
#          this (SeedCriteria.addAdjacency) so the picker and the AI cannot drift apart on it.
#          (5) WEAK FILTERS ARE LABELLED, from the same data. "Plains next to forest" is true of
#          very nearly every seed — both are within reach in 60 of 60 and typically 181 apart — so
#          the picker says "both are near spawn in almost every seed, narrows little" rather than
#          letting someone start that search hopefully. The rule is derived from the per-biome
#          near-spawn rates rather than a table of pairs, because seven pairs were measured and
#          there are thousands. Biome rows now carry their own rate too (pale garden 38% of seeds,
#          deep dark 5% and flagged slow, plains 100%).
#          (6) THE AI KNOWS ALL OF IT — a new capability the phrase book does not teach is a
#          capability that comes back as "can't check". New "adjacent" array in the schema, "small"
#          added to size, and a NEW BIOME PHRASE BOOK, which the structure rows never needed: a row
#          is called roughly what a player says, a biome is not. The id is dark_forest and people
#          say "dark oak"; the id is cherry_grove and people say "cherry blossom"; half the players
#          still say "mesa". 30 entries, all gated on the live biome list. wishDiag now resolves 39
#          wishes including 16 in the new style, and the three that are refused are refused for the
#          real reason with the rest of the wish still searched.
#          (7) SPEED, measured not asserted (bench, 1500/2000/25 seeds, shipped vs nearest with a
#          shipped-recheck row that reproduced). The "next to" search costs almost nothing where it
#          was placed: pale garden + dark forest ran 67.9 seeds/sec Exact against 67.3 for a plain
#          jungle search, and 222.5 Fast against 235.5 — because the biome stage rejected 93% of
#          seeds before adjacency was ever reached, so it ran on 139 seeds out of 2000.
#          (8) findBottleneck now treats a pair as its own item. It could only ever name one of the
#          two ends before, which is exactly the wrong advice: both biomes can be common near spawn
#          and still almost never land beside each other, and the player would have removed the
#          wrong thing.
