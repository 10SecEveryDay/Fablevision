#          vanilla's own WorldgenRandom.seedSlimeChunk rather than copying the hash, and runs FIRST
#          in the funnel because anything that can reject a seed for free belongs ahead of
#          everything that cannot. NEW gradlew slimeDiag proved the rule over 5,120,000 chunks:
#          10.002% (vanilla's nextInt(10)==0), so the one value that could have been wrong is not.
#          IT ALSO PROVED THE OBVIOUS ASK IS WORTHLESS. Slime chunks are 1 in 10 and the chunks in a
#          radius grow with its square, so "3 slime chunks within 200" is true of 100% of seeds —
#          measured average 48.4 of them, never fewer than 28 in 2000 seeds. The picker row
#          therefore uses its OWN fixed 64-block reach instead of the screen's distance control,
