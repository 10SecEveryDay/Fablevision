#          picker and the AI say plainly when a combination narrows nothing.
#          (6) A BIG VILLAGE, AI-only and with a measured number: >= 133 pieces, the p67 of 250
#          villages across all five types. Not a picker row, because size only means something for
#          structures whose size varies and an igloo is always an igloo — the same reason the flat
#          biomes lost their size tiers.
