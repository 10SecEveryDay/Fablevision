# 1.41.3 = FIVE THINGS FOUND BY PLAYING 1.41.2.
#          1. THE SEARCH FROZE THE MACHINE. It took every core at NORMAL priority, on the argument
#          that nothing else wants the CPU on the Create World screen. That argument is about
#          Minecraft and the machine is not only running Minecraft: fans maxed, the desktop stopped
#          responding, and the only input that still landed was Stop. Now cores-1 workers at
#          MIN_PRIORITY - the same thing the in-world path used to do, which was deleted with that
#          path when the behaviour was never about being in a world. Costs about one core.
#          2. "BEST survival seed" WAS BROKEN, and the two halves of it were separate bugs.
#          The default Groq model reasons out loud, so the reply was paragraphs of working out with
#          the JSON somewhere inside; the extractor took the first "{" to the last "}", spanned from
#          a brace in the prose into the answer, and reported "Couldn't read the AI's answer" - the
#          same sentence it used for a refusal, a truncation and a prose reply, none of which have
#          the same fix. Reasoning is now switched off at the request (Groq's reasoning_format, with
