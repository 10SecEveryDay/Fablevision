# 1.39.0 = a bug pass over things that were hurting real use, plus two features deleted outright.
#          NEW gradlew repro reproduces reported bugs against the real finder BEFORE anything is
#          changed, because this project has twice now "found" a bug in the finder that turned out
#          to be a bug in the tool checking it.
#          (1) SEVEN BIOMES SILENTLY BECAME THREE. The AI path capped biomes at 3 and dropped the
#          rest without a word, so "7 wood types near spawn" ran a search for under half the wish
