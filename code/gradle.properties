#          statsDiag censuses fortress pieces BY CLASS (a fortress is built from code and has no
#          template files at all). MonsterThrone — the blaze spawner room — came out at exactly 2 in
#          all 150 fortresses assembled, min = max. Asking for one would filter nothing, so it was
#          not built. Eleven other piece classes DO vary, so the capability is there if a use for it
#          turns up.
#          (8) multiDiag grew cases for the counted and spawn-inside rows, and both of them caught
#          the TOOL rather than the finder — for the second release running. A counted row is now
