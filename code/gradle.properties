#          rate, and what large/small mean for THAT biome) and for the slime row.
# 1.41.2 = RELEASE BUILD. The in-game assistant can now answer the question the mod was rejected
#          over.
#          MOD_GUIDE said where the seed finder lives and never said where it does NOT work, so the
