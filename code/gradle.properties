# 1.39.1 = an honesty pass: three places where the app told the player something that was not so.
#          FAST MODE now MEANS its number. It searched from the world origin and reported the
#          distance from there, so "within 100" handed back a village 139 blocks from the real
#          spawn and said 139 on its own confirmation line. It now does the one spawn lookup on a
#          HIT (never per seed — that is the whole mode), re-measures every find from the real
#          spawn against the reach it was searched with, and rejects the seed if anything is
#          outside. Measured by the new spawnDrift task: the lookup is 10.6ms and 2.5%-9.7% of hits
#          are turned down, which is affordable because the real spawn is a MEDIAN OF 40 BLOCKS
#          from 0,0 (p75 167, p95 608). Re-running the whole wish from the spawn instead was
#          measured too and keeps only 1-2% more for 35% more time, so it was not taken. Biomes and
#          slime chunks are re-checked as well; they never were. Fast-mode lines no longer say
#          "from spawn" about a distance measured from the origin.
#          SEED SPOILERS actually hide everything now. withoutCoords matched three specific line
#          shapes on the reasoning that every line comes from findLine — and the SLIME row does
#          not, so it printed exact chunk coordinates to someone who had turned spoilers off. The
#          rule is inverted: any pair of numbers is treated as a position, so a future line is
#          covered before anyone thinks about it. The one line that legitimately said "0, 0" was
#          reworded rather than excepted.
#          THE AI CAN ACTUALLY DISABLE EVERYTHING, and can no longer claim it did when it did not.
#          There was no marker for "all", so "disable all features" got a confident sentence and no
#          change. Added all/autoLan/seedSpoilers; a directive that is refused is now REPORTED; and
#          a reply that claims a change in the first person while applying none gets an explicit
#          correction under it.
#          GROQ was pointing at meta-llama/llama-4-scout-17b-16e-instruct, which Groq shut down on
#          17 July 2026 — every G-menu request was a 404. Now qwen/qwen3.6-27b, which is the only
#          Groq model that can still see a screenshot (the general replacement Groq suggests,
#          gpt-oss-120b, is text-only and would have broken the panel more quietly). Dead names in
#          a saved config are migrated on load, and a 404 naming a model now says where to fix it.
#          APPLESKIN saturation stopped going stale during a spear lunge. Not a rendering bug:
#          ServerPlayer only sends the health packet when health changes, food LEVEL changes, or
#          saturation crosses zero, so a draining saturation is never sent and the client value is
#          frozen until it hits 0. When we host the world the authoritative FoodData is read
#          directly. On a remote server it cannot be fixed from the client and does not pretend to.
#          SLIDERS: fire and shield offsets read 1-50 instead of stopping at 0.47 and 0.55. Same
#          scale on both, 50 is each one's own measured ceiling, and the AI speaks the same units.
#          MENUS: the empty button-sized gap is gone (Auto LAN moved into it), "Open to LAN now"
#          removed because vanilla has that button — but the Bedrock/Geyser join info it printed
#          did not exist anywhere else, so the toggle now watches for the world becoming published
#          and prints it however it was opened. The Gemini-only AI usage counter is gone: it was
#          our local count against a cap we guessed at (already wrong once by 12x) sitting next to
#          a provider error that is always right.
#          SEED SCREEN: the scroll ▲▼ buttons were drawn on top of the "Nether · End" tab and made
#          it unclickable — removed (wheel, scrollbar and the count line all already said it). All
#          five End BIOMES dropped: the End is laid out by distance from the centre in every seed,
#          so they were rows that reject nothing. End STRUCTURES stay, they are really per-seed.
#          ICONS: three ruined-portal rows and the slime row had none at all and were silently
#          showing a filled map; ocean monument/ruins/large-ruin were three shades of prismarine;
#          two "Stables" rows shared a hay block; leatherworker and swamp hut shared a cauldron.
#          New iconDiag walks the live catalog and fails on a missing or shared icon.
# 1.40.0 = Modrinth compliance, and three more places the app was not saying what it meant.
#          SEED FINDING IS NOW STRUCTURALLY CREATE-WORLD-ONLY. A moderator read the mod as
#          assisting seed cracking. It never did - seeds come from a random number generator and
#          the only direction is seed -> world, with no input for an observed structure and no
#          solver - but "true in spirit" is not a property anyone can check, and the next person to
#          add a feature will not have read the spirit. So: SeedAccess is the single door, it fails
#          CLOSED, and it demands no world loaded, no connection open, no server selected, no
#          integrated server, and registries from a CreateWorldScreen. Checked before the button is
#          added, when registries are fetched, before any worker starts, and again every 4096 seeds
#          while they run, so a search cannot survive a world starting to load.
#          DELETED rather than gated, because a feature that is switched off can be switched on:
#          the SeedFinderScreen standalone in-world GUI (its catalog half moved to
#          SeedCatalogCache), the in-world registry fallback in WorldgenContext.findSource that was
#          the one line letting the finder work inside a loaded world, and the seed-result autosave
#          that wrote seeds and coordinates to disk for a command deleted two releases ago.
#          The scope is now stated where a reviewer will find it: fabric.mod.json, README.txt, the
#          in-game guide, the screen title, and code/SEED-FINDER-SCOPE.md which names the file for
#          every claim. Optimization tag dropped - Sodium and Lithium have that covered.
#          THE 508-BLOCK BUG. A "within 500" search reported a structure at 508, and a biome at up
#          to 547. Two causes, one shape: the thing FILTERED was not the thing PRINTED. Structures
#          were filtered on the candidate chunk's MIDDLE and reported at getLocatePos, the chunk's
#          MIN corner plus an offset - 11.3 blocks apart on the diagonal. Biomes were worse:
#          findBiomeHorizontal walks rings of a SQUARE with no distance test at all, so a diagonal
#          hit on a 500-block scan is 707 blocks out. The biome end of a "next to" pair had no
#          upper bound either, so it could print "690 blocks from that grove (asked for 512 or
#          less)". Now every find is tested at the point that gets printed, rounded the way the
#          line rounds, with the cheap prefilters widened by RADIUS_SLACK first so nothing that
#          would qualify is dropped before the exact test sees it. A/B over 4000 seeds per case
#          (gradlew radiusDiag): worst reported 526->500, 525->498, 547->466, 545->466; 0 gained,
#          0 false drops, every dropped seed had been reporting outside the radius.
#          FAST-MODE EXCLUSIONS. The last row type still answering about the world origin: "no
#          desert near spawn" checked around 0,0. Extracted into checkExclusions and run a second
#          time against the real spawn on a hit, like every other row.
#          THE JOIN MESSAGE IS SHORT NOW. Four lines of explanation before the first coordinate,
#          most of it about the search rather than the world. Default is three or four lines built
#          from structured Find data; the long form is kept only when it carries something - another
#          dimension, a Fast-mode gap over 32 blocks, or a note about something dropped or
#          reinterpreted. The "- checked" suffix is gone: a find that failed the check is not in the
#          list, so its absence is the evidence. Spoiler stripping verified against the SHORT form
#          in repro (BUG 8), including that the distance survives when the coordinates do not.
#          SeedCriteria.Find exists so neither the message nor the map has to parse English back
#          apart - which is how the spoiler filter came to miss the slime row in the first place.
#          IN-GAME MAP. The badge on the Create World screen was an inactive button announcing that
#          something had happened; it now opens a top-down map of the finds around spawn, one tab
#          per dimension because their coordinates are different spaces. It draws only what the
#          search already decided - no world-gen, so it cannot disagree with the chat message.
#          MEASURED, NOT BUILT: terrain height. getBaseHeight is 3948 us PER COLUMN, so 25 columns
#          is 98ms, 6.6x an entire seed evaluation. Vanilla's own preliminarySurfaceLevel is 139x
#          cheaper but a mean of 18.7 blocks out, and on the flatness question it produced 27 false
#          flats in 240 patches - it would promise level ground that is not level. See gradlew
#          terrainCost and the proposal in the summary.
# 1.41.0 = the search's seed stream, made explicit - and one bug found in the fix itself.
#          REPORTED: "same criteria, same seed twice - it must be scanning from 0". It was not, and
#          never had been: the one live caller has always asked for random seeds, and the scan-from-0
#          mode had had no caller since the standalone screen was deleted. But the code could not
#          ANSWER that question, which is its own defect - seeds came from ThreadLocalRandom inside
#          each worker, so a run had no identity, could not be described, compared or reproduced,
#          and a report of a repeat could only be argued about.
#          Now every job carries a streamId. Random per job by default (mixed clock, because raw
#          nanoTime has poor low bits and two searches a millisecond apart would start next door);
#          pinnable for reproduction; shown as a short tag on the searching screen so two runs can
#          be told apart at a glance. The scan-from-0 mode is DELETED - dead code that made the
#          engine look like it scanned upward, which is exactly the reading that has to be
#          impossible after the seed-cracking review.
#          THE FIX HAD A BUG AND streamDiag CAUGHT IT. Workers were seeded
#          `streamId + w * 0x9E3779B97F4A7C15`. That constant is SplittableRandom's OWN internal
#          gamma, so offsetting the seed by one gamma produces worker 0's sequence shifted by one
#          draw: every worker was walking the same stream a step behind the last. Measured at
#          8 workers x 4000 draws -> 4007 distinct seeds instead of 32000, i.e. seven eighths of the
#          search re-testing work another thread had already done. (The ThreadLocalRandom code it
#          replaced never had this - that was a regression introduced by the fix.) Now uses
#          split(), the documented way to get independent streams; 32000 draws -> 32000 distinct.
#          THE ACTUAL CAUSE OF THE REPEAT was almost certainly not the search at all: a stopped or
#          abandoned second search left the PREVIOUS result sitting in the Create World seed box
#          with the green badge beside it, so pressing Create gave the old world back. Starting a
#          search now clears the applied seed, the finds and the seed box, so an unfinished search
#          leaves an empty box - the truth about what it found.
# 1.41.1 = the six audit findings that were worth fixing before release.
#          SeedCriteria's CLASS DOC described the bug that was removed - "Fast mode measures from
#          0,0, the target may be a short walk from where you spawn" was the first thing a reader
