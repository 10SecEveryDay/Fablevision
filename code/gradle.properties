#          answer to a question nobody asked, attached to a search that had worked perfectly, and it
#          reads as a warning that something is wrong. Every row's `cant` is about LOOT, and none of
#          them is implied by clicking a row. Removed from all THREE places that added it
#          (SpawnWishScreen.startSimple, SpawnWishScreen.startSearch and WishParser.parse), and
#          SeedCriteria.notes()/shortNotes() went with them so it cannot come back by accident. What
#          remains is the AI's own "cant" field — written in response to the player's actual words,
#          which is the only version of this note that was ever wanted — and the notes about parts
#          the app really did drop from a wish.
#          (3) SURFACE vs BURIED PORTALS, and the mechanism is not what it looked like. NEW gradlew
#          portalDiag assembled 840 portals expecting a per-seed roll and found none: the piece is
#          built with setup.placement() straight from the structure's configuration, and every
#          ruined-portal variant in this version ships exactly ONE setup. Standard, jungle and
#          mountain are always ON_LAND_SURFACE; desert is always PARTLY_BURIED; ocean and swamp are
#          always ON_OCEAN_FLOOR. So "a portal I can walk up to" is not a layout question at all, it
#          is a structure-id filter like warm vs cold ocean ruins — three new rows (Surface, Buried,
#          Underwater Ruined Portal) that cost nothing and assemble nothing. The variant→placement
#          mapping is READ from the structure's setup list via the access widener, not typed, so a
#          datapack that changes it changes the rows too. A variant configured with two placements
#          would genuinely be a roll and is deliberately left out of all three rows rather than
#          guessed into one.
#          (4) "BIG" STOPPED OVERSELLING. A large pale garden is 96 blocks across, which is nobody's
#          idea of big, and a tier that sounds absolute promises more than the measurement supports.
#          The picker now says "Larger"/"Smaller" and the line under it gives the real threshold and
#          the qualifier the word was hiding: "≥64 blocks across — large for a pale garden".
#          (5) NEW gradlew multiDiag, for the suspicion that a multi-row search might not satisfy
#          every row. It does not read the funnel: it takes the seeds the finder returned and the
#          coordinates it PRINTED, then rebuilds each structure at that spot and reads its real
#          piece list — code that never calls confirm(), the placement math, or any of the caching.
#          A row the search had skipped would come back empty. VERDICT: 17 seeds, 60 individual row
#          claims across 5 bundles in both modes, 0 false matches. The multi-row AND is sound.
#          Its first run reported FIVE false matches and every one of them was the TOOL. Four nether
#          fortresses and a desert pyramid: both are built from CODE rather than from template files,
#          so every piece they make is a plain StructurePiece with no template location, and
#          templateIds() returns an empty list for a structure standing right there. The catalog has
#          said this about the fortress since the day it was added; the diagnostic just did not
#          honour it. Existence now goes through the new VillageLayout.pieceCount() (which counts
#          what really assembled) and the template list is consulted ONLY for what a row demands
#          INSIDE a structure. The shipped funnel never had this bug — a row with no piece
#          requirement goes through generatesHere(), and the empty-list branch in layoutMatches is
#          reachable only for content rows, which by construction want a template-built structure.
#          The lesson is the one worth keeping: an empty piece list is not evidence of absence.
# 1.38.0 = the speed fix that mattered, five new things to search for, and one deliberately NOT built.
#          (1) MULTI-PART SEARCHES GOT 23x FASTER, and no answer changed. NEW SeedFunnel.LATE_LAYOUT.
#          A content row assembles the structure and reads its piece list — about 700ms — and it did
#          that from INSIDE the per-target loop, which walks the catalog in its own order. So
#          "village with an armorer + portal + shipwreck + pyramid" built the village in full before
#          the portal had been asked whether the seed was worth anything. Measured on exactly that
#          bundle over 1200 seeds: 347 assemblies for ONE hit, and 336 of those seeds were then
#          thrown away by a later row's distance filter. Deferring the assembly until every cheap
#          test in the whole wish has passed — the same move fix 4b made for the strict biome test —
#          takes it to 9 assemblies, 312.22s -> 13.64s. Every one of the ten benchmark searches
#          returned a BYTE-IDENTICAL result checksum with the fix on and off, which is the whole
#          test: this is allowed to change when work happens and never which seeds match. The
#          single-row searches moved by 1-9% (noise) because they have no second row to reject a
#          seed early, and the re-run of the baseline landed within 3% of itself.
#          (2) COUNTS. "Two shipwrecks" used to silently search for one — the number was dropped.
#          Rows now carry a count, the funnel keeps going instead of stopping at the first find, and
#          every find gets its own coordinate line. Capped at 4 plain / 2 content, because each
#          extra one on a content row is another 700ms assembly. A counted row is deliberately NOT
#          deferred: the deferred pass takes the first candidate that passes, which is right for
#          "one of these" and would quietly satisfy "three of these" with one.
#          (3) SPAWN INSIDE, which is not the same question as "near". A village's locate position
#          is a corner of one piece, and statsDiag measured villages spanning 40 to 238 assembled
#          pieces — nearly a factor of six — so "40 blocks away" tells you nothing about whether you
#          are standing in it. This tests the real assembled bounding box against the real spawn
#          point. It forces Exact mode in SeedFinder rather than trusting the UI: Fast measures from
#          0,0, and answering from 0,0 is not a rougher answer, it is a different question.
#          (4) STRUCTURE-TO-STRUCTURE "NEXT TO". Either end can now be a structure, and a structure
#          anchor is CHEAPER than a biome one — the funnel already located every candidate, so the
#          pair just re-sorts a list it is holding. It also refuses pairs that share a STRUCTURE SET,
#          read from the live placements rather than remembered: the world places one winner per
#          region per set, so those two can never be neighbours. Fortress + bastion is exactly that
#          pair, and it is the one people ask for.
