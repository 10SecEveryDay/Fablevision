#          116, 130, 174, 184, 196, which walks off the bottom of a small window.
#          (12) fastDiag WAS BROKEN AND SILENTLY LYING, found while running the regression. Its
#          coordinate parser still expected the pre-1.36.0 line shape "<label> @ x, z", so after the
