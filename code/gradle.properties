#          say what the two modes actually differ in: not the promise, only the order of the work.
#          THE PICKER REFUSED A PAIR THE ENGINE SUPPORTS. Linking two structures said "one end has
#          to be a biome - the distance is measured from the biome patch". Neither half was true:
#          addStructurePair has shipped since 1.38, the AI path uses it, and a structure anchor is
#          measured from the structure the funnel already found, which is CHEAPER than a biome
#          anchor. So "fortress next to bastion" worked if you typed it and was refused if you
#          clicked it. Now allowed; the refusal logic is extracted to
#          SeedCriteria.whyNotStructurePair so the picker and the search cannot disagree, and it is
#          asked at LINK time rather than at Search time. startSimple gained the branch that wires
#          it - it only ever looked up a biome anchor, so allowing the click alone would have
