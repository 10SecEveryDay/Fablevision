pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Auto-downloads the right JDK if it isn't installed. 0.9.0 could not do it on Gradle 9 (it referenced
    // JvmVendorSpec.IBM_SEMERU, which Gradle 9 removed), so it only ever "worked" where JDK 25 was installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'FableVision'
